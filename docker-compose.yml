services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp_copilot
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

  backend:
    image: python:3.12-slim
    working_dir: /workspace
    command: sh -c "pip install -r backend/requirements.txt && uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql+psycopg://erp:erp@postgres:5432/erp_copilot
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  postgres-data:
